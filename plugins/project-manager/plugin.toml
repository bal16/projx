id = "projx/project-manager"
name = "Project Manager (projx)"
version = "0.2.0"
author = "projx"
plugin_api = 3
license = "MIT"
description = "Universal project manager. Lists and launches projects from pjx (zed, vscode, nvim, ...) via the Noctalia launcher."
# Requires pjx binary on PATH (install via: go install github.com/bal16/projx/cmd/pjx@latest)
dependencies = ["pjx", "nohup"]

[[launcher_provider]]
id = "projects"
entry = "launcher.luau"
prefix = "pjx"
glyph = "folder-open"
include_in_global_search = false

[[widget]]
id = "current"
entry = "widget.luau"

[[setting]]
key = "new_window"
type = "bool"
label_key = "settings.new_window.label"
description_key = "settings.new_window.description"
default = false
