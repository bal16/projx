name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (build, vet, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format check (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt issues:"
            gofmt -l .
            exit 1
          fi
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13
      - name: Format check (goimports)
        run: |
          if ! command -v golangci-lint >/dev/null 2>&1; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
            export PATH="$PATH:$(go env GOPATH)/bin"
          fi
          golangci-lint fmt --diff
      - name: Test
        run: go test ./...

  qml:
    name: QML (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qt6-base-dev 2>/dev/null || true
          # qmllint may be named qmllint6 or in a different package; locate it
          if ! command -v qmllint >/dev/null 2>&1; then
            QMLLINT=$(find /usr -name "qmllint*" -type f 2>/dev/null | head -1)
            if [ -n "$QMLLINT" ]; then sudo ln -sf "$QMLLINT" /usr/local/bin/qmllint; fi
          fi
      - name: Lint QML
        continue-on-error: true
        run: |
          if command -v qmllint >/dev/null 2>&1; then
            # DMS-specific components (qs.*) are not resolvable in CI; treat as informational.
            qmllint plugins/dms/*.qml || true
            echo "QML lint completed (warnings expected for DMS-specific components)."
          else
            echo "qmllint not available in CI; skipping (validated locally)"
          fi

  luau:
    name: Luau (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install StyLua
        run: |
          # StyLua release assets are named stylua-linux-x86_64.zip
          curl -sL https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip -o /tmp/stylua.zip
          unzip -o /tmp/stylua.zip -d /tmp/stylua
          sudo mv /tmp/stylua/stylua /usr/local/bin/
      - name: Format check
        run: stylua --check plugins/project-manager/
