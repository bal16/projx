name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (build, vet, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format check (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt issues:"
            gofmt -l .
            exit 1
          fi
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13
      - name: Format check (goimports)
        run: |
          if ! command -v golangci-lint >/dev/null 2>&1; then
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.13.2
          fi
          golangci-lint fmt --diff
      - name: Test
        run: go test ./...

  qml:
    name: QML (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt tools
        run: sudo apt-get update && sudo apt-get install -y qml6-module-qtquick qt6-declarative-dev-tools
      - name: Lint QML
        run: qmllint plugins/dms/*.qml

  luau:
    name: Luau (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install StyLua
        run: |
          curl -sL https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux.zip -o /tmp/stylua.zip
          unzip -o /tmp/stylua.zip -d /tmp/stylua
          sudo mv /tmp/stylua/stylua /usr/local/bin/
      - name: Format check
        run: stylua --check plugins/noctalia/
