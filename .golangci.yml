version: "2"

run:
  timeout: 5m
  go: "1.27"

linters:
  default: standard
  enable:
    - errcheck
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gocyclo
    - dupl
    - gocritic
  disable:
    - revive
  settings:
    gocyclo:
      min-complexity: 50
    dupl:
      threshold: 100
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocyclo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bal16/projx

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

output:
  formats:
    text:
      path: stdout
