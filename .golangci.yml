version: "2"

run:
  timeout: 5m
  go: "1.27"

linters:
  default: standard
  disable:
    - revive
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - gocyclo
    - dupl
    - gocritic

linters-settings:
  gocyclo:
    min-complexity: 25
  dupl:
    threshold: 100
  goimports:
    local-prefixes: github.com/bal16/projx
  misspell:
    locale: US
  revive:
    severity: warning
    rules:
      - name: exported
        disabled: true
      - name: package-comments
        disabled: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gocyclo
  max-issues-per-linter: 50
  max-same-issues: 5

output:
  format: colored-line-number
